[package]
name = "verify_test"
version = "0.1.0"
edition = "2021"

[dependencies]
hickory-proto = { version = "0.25", features = ["dnssec-ring"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
ring = "0.17"
rsa = { version = "0.9", features = ["sha1", "sha2"] }
sha1 = "0.10"
sha2 = "0.10"
